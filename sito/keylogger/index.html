<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simulazione didattica di un keylogger. Mostra in ordine i tasti premuti nel campo di prova.">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/theme.js"></script>
  <title>Keylogger: un esempio pratico</title>
  <style>
    .shell { max-width:680px; }
    main { padding-block:clamp(32px, 8vw, 80px); }
    h1 { margin:0; font-size:clamp(2.25rem, 7vw, 3.5rem); line-height:1.1; letter-spacing:-.04em; }
    .intro { color:var(--muted); margin:12px 0 28px; }
    .demo { padding:clamp(20px, 5vw, 32px); background:var(--panel); border:1px solid var(--line); border-radius:20px; }
    label { display:block; font-weight:700; }
    #test-area { width:100%; margin:8px 0 20px; padding:10px 14px; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--muted); border-radius:10px; }
    #test-area:focus { outline:3px solid var(--blue); outline-offset:3px; }
    #test-area::placeholder { color:var(--muted); opacity:1; }
    .result { margin:0; color:var(--muted); }
    #sequence { display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-height:2.25rem; margin-top:6px; }
    #sequence kbd { max-width:100%; padding:4px 10px; background:var(--surface); border:1px solid var(--line); border-radius:7px; font:700 1rem/1.4 var(--mono); overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="nav-link" href="../">Lezioni di Informatica</a>
    </header>
    <main>
      <h1>Keylogger: un esempio pratico</h1>
      <p class="intro" id="instructions">Questa demo simula il funzionamento di un keylogger nel campo di prova. Seleziona il campo con un clic o con Tab, poi premi alcuni tasti. La sequenza si azzera quando esci dal campo.</p>
      <div class="demo">
        <label for="test-area">Campo di prova</label>
        <input id="test-area" type="text" readonly placeholder="Premi un tasto…" aria-describedby="instructions">
        <p class="result" id="result-label">Sequenza dei tasti</p>
        <div id="sequence" role="log" aria-labelledby="result-label">In attesa</div>
        <noscript><p>Attiva JavaScript per usare la demo.</p></noscript>
      </div>
    </main>
  </div>
  <script>
    const testArea = document.querySelector("#test-area");
    const sequence = document.querySelector("#sequence");

    testArea.addEventListener("keydown", (event) => {
      if (event.isComposing) return;
      if (!sequence.childElementCount) sequence.textContent = "";
      const key = document.createElement("kbd");
      key.textContent = event.key === " " ? "Spazio" : event.key;
      sequence.append(key);
    });

    testArea.addEventListener("blur", () => {
      sequence.textContent = "In attesa";
    });
  </script>
</body>
</html>
