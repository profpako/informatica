<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Scopri come il browser riconosce i tasti premuti in un campo di prova.">
  <link rel="stylesheet" href="../assets/site.css">
  <script src="../assets/theme.js"></script>
  <title>Demo tastiera</title>
  <style>
    .shell { max-width:680px; }
    main { padding-block:clamp(32px, 8vw, 80px); }
    h1 { margin:0; font-size:clamp(2.25rem, 7vw, 3.5rem); line-height:1.1; letter-spacing:-.04em; }
    .intro { color:var(--muted); margin:12px 0 28px; }
    .demo { padding:clamp(20px, 5vw, 32px); background:var(--panel); border:1px solid var(--line); border-radius:20px; }
    label { display:block; font-weight:700; }
    #test-area { width:100%; margin:8px 0 20px; padding:10px 14px; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--muted); border-radius:10px; }
    #test-area:focus { outline:3px solid var(--blue); outline-offset:3px; }
    #test-area::placeholder { color:var(--muted); opacity:1; }
    .result { margin:0; color:var(--muted); }
    output { display:block; margin-top:4px; color:var(--ink); font:700 1.5rem/1.3 var(--mono); overflow-wrap:anywhere; }
  </style>
</head>
<body>
  <div class="shell">
    <header class="site-header">
      <a class="nav-link" href="../">Lezioni di Informatica</a>
    </header>
    <main>
      <h1>Demo tastiera</h1>
      <p class="intro" id="instructions">Seleziona il campo di prova con un clic o con Tab, poi premi un tasto. Il risultato si azzera quando esci dal campo.</p>
      <div class="demo">
        <label for="test-area">Campo di prova</label>
        <input id="test-area" type="text" readonly placeholder="Premi un tasto…" aria-describedby="instructions">
        <p class="result" id="result-label">Ultimo tasto</p>
        <output for="test-area" aria-labelledby="result-label">In attesa</output>
        <noscript><p>Attiva JavaScript per usare la demo.</p></noscript>
      </div>
    </main>
  </div>
  <script>
    const testArea = document.querySelector("#test-area");
    const result = document.querySelector("output");

    testArea.addEventListener("keydown", (event) => {
      if (event.isComposing) return;
      result.value = event.key === " " ? "Spazio" : event.key;
    });

    testArea.addEventListener("blur", () => {
      result.value = "In attesa";
    });
  </script>
</body>
</html>
