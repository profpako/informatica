<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Student Extractor · Sorteggio studenti</title>
<style>
  :root {
    --ink: #201c35; --muted: #625e75; --border: #e8e6ef; --surface: #fff;
    --page: #f7f7fb; --purple: #5e43d5; --purple-dark: #4931b2;
    --purple-soft: #f0ecff; --green: #176d51; --radius: 20px;
    --primary-hover: #4931b2; --on-primary: #fff; --subtext: #51495f; --quiet: #726b87;
    --row-border: #f0eef4; --hover: #f4f1ff; --hover-border: #d8cef9; --selected-border: #ebe4ff;
    --table-head: #f9f8fc; --control-border: #d9d3e6; --lavender: #e6ddff;
    --chip-fill: #eee9fa; --chip-ink: #574888; --danger: #a52848; --warning: #92501d;
    --alert-fill: #fff4df; --alert-ink: #724716; --alert-border: #efd9b2;
    --mint-fill: #e7f8f0; --mint-ink: #1a694f; --lilac-fill: #f0eaff; --lilac-ink: #6044b0;
    --blue-fill: #e8f2ff; --blue-ink: #265d9e; --peach-fill: #fff1e5; --peach-ink: #9a5024;
    --pink-fill: #fdeef3; --pink-ink: #953d68;
    color-scheme: light;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink); background: var(--page);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --ink: #f1edf9; --muted: #b9b0c9; --border: #3c324c; --surface: #21192e;
    --page: #171121; --purple: #bba4ff; --purple-dark: #d9c9ff; --purple-soft: #35264d;
    --primary-hover: #d0bfff; --on-primary: #22113b; --subtext: #d7cde5; --quiet: #ac9dbd;
    --row-border: #352a44; --hover: #312441; --hover-border: #5b4974; --selected-border: #594573;
    --table-head: #2a2038; --control-border: #544562; --lavender: #43305e;
    --chip-fill: #3b2b55; --chip-ink: #dbccff; --green: #93dfbd; --danger: #ff9bb4; --warning: #ffcb8d;
    --alert-fill: #382716; --alert-ink: #fbd8a6; --alert-border: #684823;
    --mint-fill: #19392e; --mint-ink: #a1e9c8; --lilac-fill: #3a2855; --lilac-ink: #e0cfff;
    --blue-fill: #223653; --blue-ink: #bad5ff; --peach-fill: #422c20; --peach-ink: #ffceac;
    --pink-fill: #49283a; --pink-ink: #ffc0da;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; min-width: 320px; }
  h1, h2, h3, p { margin: 0; }
  button, select, input, textarea { font: inherit; }
  button, select { cursor: pointer; }
  button { color: inherit; }
  button:disabled { cursor: not-allowed; opacity: .46; }
  :focus-visible { outline: 3px solid #8368f0; outline-offset: 3px; }
  [hidden] { display: none !important; }
  .icon { width: 19px; height: 19px; flex: none; vertical-align: middle; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .app { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; }
  .sidebar { background: var(--surface); border-right: 1px solid var(--border); padding: 0 17px 19px; display: flex; flex-direction: column; min-height: 100vh; height: 100%; align-self: start; }
  .brand { display: flex; align-items: center; gap: 11px; height: 73px; padding: 0 5px; border-bottom: 1px solid var(--border); margin-bottom: 28px; }
  .brand-mark { display: grid; place-items: center; flex: none; width: 40px; height: 40px; border-radius: 12px; color: white; background: #6949df; box-shadow: 0 4px 10px #6848df35; }
  .brand-mark .icon { width: 23px; height: 23px; }
  .brand-name { display: block; font-size: 15px; font-weight: 780; letter-spacing: -.035em; }
  .brand-caption { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); }
  .sidebar-label { display: block; font-size: 10px; color: var(--muted); letter-spacing: .11em; text-transform: uppercase; font-weight: 760; }
  .year-group { padding: 0 3px; }
  .year-field { display: grid; grid-template-columns: minmax(0, 1fr) 36px; gap: 7px; margin-top: 9px; }
  .year-select { position: relative; min-width: 0; }
  .year-select select { width: 100%; appearance: none; border: 1px solid var(--border); border-radius: 9px; background: var(--surface); color: var(--ink); padding: 0 26px 0 30px; height: 38px; font-size: 13px; font-weight: 650; }
  .year-select .icon { position: absolute; top: 11px; left: 9px; width: 15px; height: 15px; color: var(--quiet); pointer-events: none; }
  .year-select .chevron { left: auto; right: 8px; }
  .square, .button { border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 38px; }
  .square { width: 36px; padding: 0; flex: none; }
  .square .icon { width: 16px; height: 16px; }
  .button { padding: 0 13px; font-size: 13px; font-weight: 700; white-space: nowrap; }
  .button .icon { width: 16px; height: 16px; }
  .square:hover:not(:disabled), .button:hover:not(:disabled) { background: var(--hover); border-color: var(--hover-border); }
  .button.primary { background: var(--purple); border-color: var(--purple); color: var(--on-primary); }
  .button.primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }
  .button.tint { color: var(--purple-dark); background: var(--purple-soft); border-color: var(--selected-border); }
  .button.danger { color: var(--danger); }
  .classes-heading { margin: 28px 3px 9px; display: flex; align-items: center; justify-content: space-between; gap: 5px; }
  .classes-heading .square { min-height: 28px; width: 28px; border-color: transparent; color: var(--purple); }
  .class-list { display: grid; gap: 5px; }
  .class-entry { display: flex; align-items: center; min-width: 0; gap: 2px; padding-right: 5px; border: 1px solid transparent; border-radius: 11px; }
  .class-entry.active { background: var(--purple-soft); border-color: var(--selected-border); }
  .class-pick { border: 0; background: transparent; padding: 8px; display: flex; min-width: 0; flex: 1; text-align: left; align-items: center; gap: 9px; border-radius: 10px; }
  .class-pick:hover { background: var(--hover); }
  .class-symbol { display: grid; place-items: center; width: 32px; height: 32px; flex: none; border-radius: 8px; background: var(--lavender); color: var(--purple); }
  .class-symbol .icon { width: 16px; height: 16px; }
  .class-text { min-width: 0; }
  .class-name { display: block; font-weight: 740; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .class-size { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
  .class-entry .square { border: 0; background: transparent; min-height: 29px; width: 27px; color: var(--muted); }
  .sidebar-empty { font-size: 12px; padding: 5px; color: var(--muted); }
  .archive-tools { margin-top: 19px; padding: 12px 3px 0; border-top: 1px solid var(--border); }
  .archive-tools .button { width: 100%; justify-content: flex-start; }
  .archive-status { padding: 6px 2px 0; color: var(--muted); font-size: 11px; line-height: 1.4; }
  .archive-status.saved { color: var(--green); }
  .archive-status.warning { color: var(--warning); }
  .theme-switch { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; margin-top: 13px; max-width: 190px; border: 1px solid var(--border); border-radius: 10px; padding: 3px; background: var(--page); }
  .theme-switch button { display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 30px; padding: 2px 4px; border: 1px solid transparent; border-radius: 7px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 700; }
  .theme-switch button:hover { background: var(--hover); }
  .theme-switch button[aria-pressed="true"] { color: var(--purple-dark); background: var(--purple-soft); border-color: var(--selected-border); }
  .theme-switch .icon { width: 14px; height: 14px; }
  .backup-actions { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0 15px; }
  .shell { min-width: 0; }
  .topbar { height: 73px; display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 31px; }
  .breadcrumb, .today { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .breadcrumb { min-width: 0; }
  .breadcrumb strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
  .breadcrumb .icon, .today .icon { width: 15px; height: 15px; color: var(--quiet); }
  .today { white-space: nowrap; }
  main { max-width: 1440px; margin: 0 auto; padding: 28px 31px 45px; }
  .page-heading { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 16px; margin-bottom: 22px; }
  h1 { font-size: clamp(27px, 3.1vw, 39px); letter-spacing: -.05em; font-weight: 790; line-height: 1.09; }
  .class-summary { display: flex; align-items: center; flex-wrap: wrap; gap: 9px; margin-top: 10px; font-size: 13px; color: var(--muted); }
  .class-summary strong { color: var(--subtext); }
  .dot { width: 4px; height: 4px; border-radius: 50%; background: #a29bb0; }
  .chip { background: var(--chip-fill); color: var(--chip-ink); border-radius: 20px; padding: 4px 8px; font-size: 10px; font-weight: 750; }
  .heading-actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .dashboard { display: grid; grid-template-columns: minmax(0, 2.12fr) minmax(250px, 1fr); gap: 17px; margin-bottom: 19px; }
  .hero { position: relative; isolation: isolate; overflow: hidden; min-width: 0; border-radius: var(--radius); background: radial-gradient(ellipse at 50% 42%, #432777 0, #251746 43%, #1b132d 83%); color: #fff; min-height: 365px; padding: 17px 19px 22px; display: flex; align-items: center; flex-direction: column; justify-content: space-between; }
  .hero::before { content: ""; position: absolute; z-index: -1; inset: 0; opacity: .57; background-image: radial-gradient(circle, #c4a8ff80 .8px, transparent 1.1px), radial-gradient(circle, #d6c6ff50 .8px, transparent 1.2px); background-size: 32px 32px, 49px 49px; background-position: 13px 15px, 2px 1px; mask-image: radial-gradient(ellipse, transparent 15%, #000 76%); pointer-events: none; }
  .hero-top { display: flex; justify-content: space-between; align-items: center; align-self: stretch; gap: 9px; position: relative; z-index: 1; }
  .available-pill { display: inline-flex; align-items: center; gap: 7px; padding: 6px 9px; border: 1px solid #ffffff2c; background: #ffffff10; border-radius: 18px; font-weight: 650; font-size: 11px; color: #f3eaff; }
  .available-pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #95edc8; box-shadow: 0 0 8px #80f5c473; }
  .available-pill.empty::before { background: #c3afd9; box-shadow: none; }
  .hero-top > span:last-child { font-size: 11px; font-weight: 650; color: #e0d0f6; }
  .hero-stage { position: relative; isolation: isolate; width: 100%; min-height: 220px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .drawing-art { position: relative; width: 245px; height: 151px; margin-top: -4px; }
  .orbit { position: absolute; border: 1px solid #c09aff35; border-radius: 50%; inset: 21px 6px 19px; transform: rotate(-16deg); }
  .orbit.second { inset: 30px 21px 25px; transform: rotate(18deg); border-color: #c29dff43; }
  .ticket { position: absolute; top: 32px; left: 50%; width: 76px; height: 87px; display: grid; place-items: center; border: 1px solid #d8baff9c; border-radius: 15px; color: #f1dcff; background: linear-gradient(155deg, #a17ae6, #5933a1); box-shadow: 0 9px 18px #190e375c; }
  .ticket.left { transform: translateX(-88%) rotate(-23deg); background: linear-gradient(145deg, #8252cf, #523280); }
  .ticket.right { transform: translateX(-11%) rotate(21deg); background: linear-gradient(160deg, #8e5bdc, #57328c); }
  .ticket.front { top: 25px; transform: translateX(-50%) rotate(-3deg); width: 77px; height: 94px; background: linear-gradient(150deg, #bb96ff, #7650ce 82%); border-color: #e4ceffd4; }
  .ticket.front::after { position: absolute; content: ""; inset: 6px; border: 1px solid #ffffff49; border-radius: 10px; }
  .ticket.front .icon { width: 34px; height: 34px; stroke-width: 1.45; }
  .star { position: absolute; color: #e8cfff; font-size: 19px; line-height: 1; text-shadow: 0 0 12px #d2a1ff; }
  .star.a { top: 25px; right: 23px; }
  .star.b { bottom: 24px; left: 23px; font-size: 14px; }
  .star.c { top: 21px; left: 46px; font-size: 10px; }
  .star.d { bottom: 24px; right: 49px; font-size: 11px; color: #cfb2fa; }
  .hero h2 { font-size: clamp(23px, 2.55vw, 33px); line-height: 1.13; font-weight: 780; letter-spacing: -.045em; overflow-wrap: anywhere; }
  .hero-description { color: #e0d1f3; font-size: 13px; margin: 8px 0 13px; line-height: 1.5; }
  .hero-controls { display: flex; align-items: end; flex-wrap: wrap; justify-content: center; gap: 10px; position: relative; }
  .quantity { display: grid; gap: 5px; }
  .quantity-label { color: #dfd0f5; font-size: 10px; font-weight: 690; }
  .stepper { display: flex; align-items: center; min-height: 44px; padding: 0 3px; background: #ffffff14; border: 1px solid #e4d1ff4a; border-radius: 11px; }
  .stepper button { color: #f9f1ff; border: 0; background: transparent; padding: 0; width: 31px; height: 35px; border-radius: 6px; }
  .stepper button:hover:not(:disabled) { background: #ffffff26; }
  .stepper .icon { width: 15px; height: 15px; }
  .stepper output { display: block; min-width: 24px; text-align: center; font-weight: 750; font-size: 15px; }
  .draw-button { height: 44px; padding: 0 19px; background: #c7aaff; border-color: #d7c0ff; color: #29164b; box-shadow: 0 4px 18px #aa7ffa39; }
  .draw-button:hover:not(:disabled) { background: #e0cbff; }
  .draw-button .icon { width: 19px; height: 19px; }
  .draw-halo { position: absolute; z-index: -1; inset: -16% -2%; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, #a275ff68 0%, #563dc454 32%, transparent 68%); animation: charge 1.1s ease-in-out infinite alternate; }
  .rolling .drawing-art { perspective: 420px; }
  .rolling .orbit { border-color: #c0a5ff9c; border-right-color: #9ff7df; box-shadow: 0 0 18px #9d7bff59; animation: revolve 1.45s linear infinite; }
  .rolling .orbit.second { border-color: #cbb0ff74; border-left-color: #ffdbaa; animation-direction: reverse; animation-duration: 1.05s; }
  .rolling .ticket.left { animation: shuffle-left .66s ease-in-out infinite alternate; }
  .rolling .ticket.right { animation: shuffle-right .66s ease-in-out infinite alternate; }
  .rolling .ticket.front { animation: shuffle-front .52s ease-in-out infinite alternate; }
  .rolling .star { animation: sparkle .72s ease-in-out infinite alternate; }
  .rolling .star.b, .rolling .star.d { animation-delay: .26s; }
  @keyframes charge { from { opacity: .48; transform: scale(.87); } to { opacity: 1; transform: scale(1.12); } }
  @keyframes revolve { from { transform: rotate(-20deg) rotateX(33deg); } to { transform: rotate(340deg) rotateX(33deg); } }
  @keyframes shuffle-left { to { transform: translate(-148%, 6px) rotate(-39deg) rotateY(-27deg); } }
  @keyframes shuffle-right { to { transform: translate(47%, -6px) rotate(37deg) rotateY(27deg); } }
  @keyframes shuffle-front { to { transform: translate(-50%, -14px) rotate(9deg) rotateY(-17deg) scale(1.09); box-shadow: 0 0 38px #bd9dff82; } }
  @keyframes sparkle { to { transform: scale(1.65); opacity: .55; } }
  .rolling-name { display: grid; place-items: center; width: min(340px, 100%); min-height: 40px; margin: 9px 0 8px; padding: 5px 12px; overflow-wrap: anywhere; border-radius: 10px; border: 1px solid #d3b7ff5e; background: #161022a8; color: #f4eaff; font-size: clamp(15px, 2vw, 21px); font-weight: 730; }
  .draw-progress { width: min(250px, 75%); height: 3px; margin: 0 0 9px; border-radius: 4px; overflow: hidden; background: #e1c9ff2e; }
  .draw-progress::before { content: ""; display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #a383ff, #e7c6ff, #a7f8dc); transform-origin: left; animation: progress var(--roll-time) linear both; }
  @keyframes progress { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  .result { padding-top: 8px; max-width: 100%; }
  .result .drawing-art { margin-inline: auto; }
  .result-label { display: inline-flex; align-items: center; gap: 6px; color: #e6d4ff; font-size: 12px; font-weight: 710; margin-bottom: 8px; }
  .result-label .icon { width: 15px; height: 15px; }
  .result h2 { font-size: clamp(27px, 4vw, 50px); text-shadow: 0 2px 24px #d1adff60; }
  .result-list { display: flex; flex-wrap: wrap; gap: 7px; justify-content: center; list-style: none; padding: 0; margin: 12px 0; }
  .result-list li { border: 1px solid #d8c0ff69; border-radius: 9px; padding: 8px 13px; background: #ffffff16; font-size: clamp(13px, 1.4vw, 17px); font-weight: 690; overflow-wrap: anywhere; max-width: 100%; }
  .result.celebrating .ticket.front { animation: winner-ticket .78s cubic-bezier(.16, 1, .3, 1) both; }
  .result.celebrating h2 { animation: reveal .62s cubic-bezier(.16, 1, .3, 1) both; }
  .result.celebrating li { animation: reveal .56s cubic-bezier(.16, 1, .3, 1) var(--reveal-delay) both; }
  @keyframes winner-ticket { from { transform: translate(-50%, 10px) rotateY(-60deg) scale(.65); } 50% { transform: translate(-50%, -8px) rotate(-7deg) scale(1.14); box-shadow: 0 0 42px #ddb6ffbf; } }
  @keyframes reveal { from { opacity: 0; transform: translateY(14px) scale(.89); } }
  .celebration { position: absolute; inset: 0; pointer-events: none; }
  .celebration::before, .celebration::after { content: ""; position: absolute; top: 45%; left: 50%; width: 145px; aspect-ratio: 1; border: 2px solid #e5c7ffac; border-radius: 50%; animation: ripple 1s ease-out both; }
  .celebration::after { border-color: #a6f2d9a0; animation-delay: .12s; }
  .celebration i { position: absolute; top: 45%; left: 50%; width: 8px; height: 11px; border-radius: 2px; background: var(--particle); box-shadow: 0 0 8px var(--particle); animation: burst 1.25s cubic-bezier(.12, .65, .25, 1) var(--delay) both; }
  .celebration i:nth-child(3n) { width: 6px; height: 6px; border-radius: 50%; }
  @keyframes ripple { from { opacity: .76; transform: translate(-50%, -50%) scale(.18); } to { opacity: 0; transform: translate(-50%, -50%) scale(2.5); } }
  @keyframes burst { 0% { opacity: 0; transform: scale(.4); } 16% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--spin)) scale(.75); } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 2px 8px #2d194504; min-width: 0; }
  .session-panel { padding: 19px 17px 16px; display: flex; flex-direction: column; }
  .panel-heading { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  .panel h2 { font-size: 17px; font-weight: 780; letter-spacing: -.034em; }
  .panel-heading p { color: var(--muted); font-size: 12px; margin-top: 5px; }
  .session-icon { display: grid; place-items: center; width: 35px; height: 35px; border-radius: 10px; background: var(--purple-soft); color: var(--purple); flex: none; }
  .session-icon .icon { width: 17px; height: 17px; }
  .metrics { margin: 13px 0 11px; }
  .metric { display: flex; align-items: center; gap: 9px; min-height: 45px; border-bottom: 1px solid var(--row-border); }
  .metric:last-child { border-bottom: 0; }
  .metric dt { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 650; color: var(--subtext); }
  .metric dd { margin: 0 0 0 auto; font-size: 16px; font-weight: 790; font-variant-numeric: tabular-nums; }
  .metric-icon { width: 28px; height: 28px; border-radius: 8px; display: inline-grid; place-items: center; }
  .metric-icon .icon { width: 15px; height: 15px; }
  .available { color: var(--mint-ink); background: var(--mint-fill); }
  .drawn { color: var(--lilac-ink); background: var(--lilac-fill); }
  .questioned { color: var(--blue-ink); background: var(--blue-fill); }
  .absent { color: var(--peach-ink); background: var(--peach-fill); }
  .session-recent { font-size: 11px; color: var(--muted); line-height: 1.45; margin-bottom: 11px; overflow-wrap: anywhere; }
  .session-recent strong { color: var(--subtext); }
  .session-actions { display: grid; gap: 7px; margin-top: auto; }
  .session-actions .button { min-height: 37px; }
  .roster { overflow: hidden; }
  .roster-heading { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; padding: 17px 17px 13px; gap: 11px; }
  .roster-heading h2 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .roster-actions { display: flex; flex-wrap: wrap; gap: 7px; }
  .roster-toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; padding: 0 17px 11px; }
  .filters { display: flex; flex-wrap: wrap; gap: 4px; }
  .filter { color: var(--muted); background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 6px 9px; font-size: 12px; font-weight: 670; }
  .filter:hover { background: var(--hover); }
  .filter[aria-pressed="true"] { color: var(--purple-dark); background: var(--purple-soft); }
  .search { display: flex; gap: 7px; align-items: center; padding: 0 9px; min-height: 32px; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); }
  .search .icon { width: 14px; height: 14px; }
  .search input { border: 0; width: 115px; background: transparent; color: var(--ink); font-size: 12px; padding: 6px 0; }
  .search input:focus { outline: 0; }
  .search:focus-within { outline: 2px solid #8368f0; }
  .table-scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; text-align: left; }

<script>
"use strict";

const STORAGE_KEY = "student-extractor.v1";
const THEME_KEY = "student-extractor.theme";
const BACKUP_FORMAT = "student-extractor-backup";
const BACKUP_ACCESS = { mode: "readwrite" };
const DRAW_TICKS = [65, 65, 70, 70, 75, 80, 90, 100, 110, 125, 140, 160, 180, 205, 230, 260, 300, 340];
const STATUS = {
  available: { label: "Disponibile", plural: "Disponibili", icon: "user" },
  drawn: { label: "Estratto", plural: "Estratti", icon: "sparkles" },
  questioned: { label: "Interrogato", plural: "Interrogati nel turno", icon: "check" },
  absent: { label: "Assente", plural: "Assenti", icon: "absent" }
};
const shortDate = new Intl.DateTimeFormat("it-IT", { day: "numeric", month: "long", timeZone: "Europe/Rome" });
const fullDate = new Intl.DateTimeFormat("it-IT", { dateStyle: "long", timeZone: "Europe/Rome" });
const weekdayDate = new Intl.DateTimeFormat("it-IT", { dateStyle: "full", timeZone: "Europe/Rome" });
const dateParts = new Intl.DateTimeFormat("it-IT", { year: "numeric", month: "numeric", timeZone: "Europe/Rome" });
const clock = new Intl.DateTimeFormat("it-IT", { timeStyle: "short", timeZone: "Europe/Rome" });
const collator = new Intl.Collator("it", { numeric: true, sensitivity: "base" });
const $ = (id) => document.getElementById(id);
const icon = (name) => '<svg class="icon" aria-hidden="true"><use href="#i-' + name + '"/></svg>';
const escapeText = (text) => String(text).replace(/[&<>"']/g, (char) => ({
  "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
}[char]));
const cleanName = (text) => text.trim().replace(/\s+/g, " ");
const normalName = (text) => cleanName(text).toLocaleLowerCase("it");
const searchName = (text) => normalName(text).normalize("NFD").replace(/\p{Diacritic}/gu, "");
const now = () => Date.now();
const newId = () => crypto.randomUUID?.() ?? Array.from(crypto.getRandomValues(new Uint32Array(4)), (value) => value.toString(16).padStart(8, "0")).join("");

function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  $("theme-light").setAttribute("aria-pressed", String(theme === "light"));
  $("theme-dark").setAttribute("aria-pressed", String(theme === "dark"));
}

function loadTheme() {
  let saved;
  try { saved = localStorage.getItem(THEME_KEY); } catch {}
  if (saved === "light" || saved === "dark") return saved;
  return matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}

function schoolYear() {
  const parts = Object.fromEntries(dateParts.formatToParts().map(({ type, value }) => [type, Number(value)]));
  return parts.month >= 9 ? parts.year : parts.year - 1;
}

function makeSession(at = now()) {
  return { id: newId(), startedAt: at, absences: [], rounds: [] };
}

function makeTurn(number, at = now()) {
  return { number, startedAt: at, questioned: [], sessions: [], session: makeSession(at) };
}

function makeClass(name) {
  return { id: newId(), name, students: [], turn: makeTurn(1), pastTurns: [] };
}

function nameRecord(student) {
  return { id: student.id, name: student.name };
}

function initialData() {
  const year = String(schoolYear());
  const classroom = makeClass("2ª ITC");
  classroom.demo = true;
  classroom.students = [
    "Alessia Amato", "Luca Barbato", "Giulia Borrelli", "Marco Caruso",
    "Sofia Coppola", "Matteo D’Amico", "Chiara De Luca", "Francesco Esposito",
    "Anna Ferrara", "Davide Fontana", "Martina Gallo", "Andrea Giordano",
    "Emma Grasso", "Antonio Greco", "Sara Leone", "Simone Longo", "Giorgia Marino",
    "Nicola Moretti", "Elena Ricci", "Paolo Romano", "Aurora Russo",
    "Michele Sanna", "Irene Vitale", "Gabriele Volpe"
  ].map((name, index) => ({ id: "demo-" + index, name }));
  classroom.turn.session.absences = [3, 8, 19].map((index) => nameRecord(classroom.students[index]));
  classroom.turn.questioned = [5, 11, 14, 20].map((index) => ({ ...nameRecord(classroom.students[index]), at: classroom.turn.startedAt }));
  return { version: 1, activeYear: year, years: [{ id: year, activeClass: classroom.id, classes: [classroom] }] };
}

let storageIssue = "";
function readState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw !== null) {
      const data = JSON.parse(raw);
      if (data?.version !== 1 || !Array.isArray(data.years) || data.years.length === 0) {
        throw new Error("Archivio non leggibile");
      }
      return data;
    }
  } catch (error) {
    storageIssue = error.name === "SecurityError"
      ? "Il browser blocca il salvataggio locale. Usa Archivio e backup per conservare le modifiche su file."
      : "L’archivio del browser non è leggibile. Puoi ripristinare una copia da Archivio e backup.";
  }
  return null;
}

let state = readState();
state ??= initialData();
if (!state.archiveId) {
  state.archiveId = newId();
  state.revision = 0;
  if (!storageIssue) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch {
      storageIssue = "Il browser non riesce a salvare i dati. Usa Archivio e backup per conservarli su file.";
    }
  }
}

let quantity = 1;
let filter = "all";
let query = "";
let rolling = false;
let submitting = false;
let submitDialog = null;
let noticeTimeout;
let backupConnection = null;
let backupStatus = "Copia automatica non attiva";
let backupLevel = "";
let backupDatabase;
let backupInMemory = false;
let backupBusy = false;
let writingBackup = false;
let archiveQueue = Promise.resolve();

function activeYear(data = state) {
  return data.years.find((year) => year.id === data.activeYear) ?? data.years[0];
}

function activeClass(data = state) {
  const year = activeYear(data);
  return year.classes.find((classroom) => classroom.id === year.activeClass) ?? year.classes[0];
}

function targetClass(data, target, requireSession = false) {
  const classroom = data.years.find((year) => year.id === target.yearId)?.classes.find((entry) => entry.id === target.classId);
  if (!classroom) throw new Error("La classe è stata rimossa.");
  if (requireSession && classroom.turn.session.id !== target.sessionId) {
    throw new Error("La sessione è cambiata. Riapri l’azione per usare quella corrente.");
  }
  return classroom;
}

function targetFor(classroom = activeClass()) {
  return { yearId: activeYear().id, classId: classroom.id, sessionId: classroom.turn.session.id };
}

async function withArchiveLock(operation) {
  let started = false;
  const run = () => {
    started = true;
    const queued = archiveQueue.then(operation);
    archiveQueue = queued.catch(() => {});
    return queued;
  };
  try {
    if (navigator.locks?.request) return await navigator.locks.request(STORAGE_KEY, run);
  } catch (error) {
    if (started || !["SecurityError", "NotSupportedError"].includes(error.name)) throw error;
  }
  return run();
}

function latestState() {
  return storageIssue ? state : readState() ?? state;
}

async function commit(change) {
  return withArchiveLock(async () => {
    const latest = latestState();
    state = latest;
    const next = JSON.parse(JSON.stringify(latest));
    const value = change(next);
    next.revision = (latest.revision ?? 0) + 1;
    let browserFailed = false;
    if (!storageIssue) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(next));
      } catch {
        browserFailed = true;
      }
    }
    const copied = await syncBackup(next);
    if ((browserFailed || storageIssue) && !copied) {
      throw new Error("Salvataggio non riuscito. Scarica una copia o riattiva il backup prima di riprovare.");
    }
    if (browserFailed) storageIssue = "Il salvataggio nel browser non è disponibile. L’archivio è stato salvato su file.";
    state = next;
    return value;
  });
}

function backupDocument(data) {
  return { format: BACKUP_FORMAT, savedAt: now(), writeId: newId(), data };
}

function decodeBackup(text) {
  const invalid = () => new Error("Il file non è una copia valida di Student Extractor.");
  let backup;
  try { backup = JSON.parse(text); } catch { throw invalid(); }
  const record = (value) => value && typeof value === "object" && !Array.isArray(value);
  const string = (value) => typeof value === "string" && value.trim().length > 0;
  const date = (value) => Number.isInteger(value) && value >= 0 && value <= 8.64e15;
  const entries = (value, check) => Array.isArray(value) && value.every(check);
  const named = (value) => record(value) && string(value.id) && string(value.name);
  const namedList = (value) => entries(value, named) && new Set(value.map(({ id }) => id)).size === value.length;
  const roundValid = (round) => record(round) && date(round.at) && namedList(round.students) && round.students.length > 0 &&
    (round.cancelled === undefined || (entries(round.cancelled, (id) => round.students.some((student) => student.id === id)) &&
      new Set(round.cancelled).size === round.cancelled.length));
  const session = (value) => record(value) && string(value.id) && date(value.startedAt) &&
    namedList(value.absences) && entries(value.rounds, roundValid);
  const turn = (value) => record(value) && Number.isSafeInteger(value.number) && value.number > 0 &&
    date(value.startedAt) && namedList(value.questioned) && value.questioned.every((entry) => date(entry.at)) &&
    entries(value.sessions, session);
  const classroom = (value) => named(value) && namedList(value.students) && turn(value.turn) &&
    session(value.turn.session) && entries(value.pastTurns, turn);
  const year = (value) => record(value) && typeof value.id === "string" && /^\d{4}$/.test(value.id) &&
    entries(value.classes, classroom) && (value.activeClass === null ||
      value.classes.some((entry) => entry.id === value.activeClass));
  const data = backup?.data;
  if (!record(backup) || backup.format !== BACKUP_FORMAT || !date(backup.savedAt) || !string(backup.writeId) ||
      !record(data) || data.version !== 1 || !string(data.archiveId) || !Number.isSafeInteger(data.revision) ||
      data.revision < 0 || !entries(data.years, year) || !data.years.some((entry) => entry.id === data.activeYear)) {
    throw invalid();
  }
  return backup;
}

function backupName(label, suffix) {
  return "student-extractor-" + label + "-" + new Date().toISOString().slice(0, 10) + "-" + suffix + ".json";
}

function downloadBackup(data, label = "backup") {
  const backup = backupDocument(data);
  const link = document.createElement("a");
  link.download = backupName(label, backup.writeId.slice(0, 8));
  link.href = URL.createObjectURL(new Blob([JSON.stringify(backup, null, 2)], { type: "application/json" }));
  document.body.append(link);
  link.click();
  link.remove();
  window.setTimeout(() => URL.revokeObjectURL(link.href), 30000);
}

function setBackupStatus(message, level = "") {
  backupStatus = message;
  backupLevel = level;
  const label = $("backup-status");
  if (label.textContent !== message) label.textContent = message;
  label.className = "archive-status" + (level ? " " + level : "");
}

function backupStore(value) {
  backupDatabase ??= new Promise((resolve, reject) => {
    const request = indexedDB.open("student-extractor-backup", 1);
    request.onupgradeneeded = () => request.result.createObjectStore("connections");
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
    request.onblocked = () => reject(new Error("L’archivio è aperto in un’altra scheda."));
  });
  return backupDatabase.then((database) => new Promise((resolve, reject) => {
    const saving = value !== undefined;
    const transaction = database.transaction("connections", saving ? "readwrite" : "readonly");
    const store = transaction.objectStore("connections");
    const key = location.pathname;
    const request = saving ? store.put(value, key) : store.get(key);
    transaction.oncomplete = () => resolve(request.result);
    transaction.onabort = () => reject(transaction.error);
    transaction.onerror = () => reject(transaction.error);
  }));
}

async function getBackupConnection() {
  if (backupInMemory) return backupConnection;
  try {
    const stored = await backupStore();
    backupConnection = stored ?? null;
  } catch {
    // The chosen file remains usable in this tab when the browser cannot remember it.
  }
  return backupConnection;
}

async function rememberBackup(connection) {
  backupConnection = connection;
  try {
    await backupStore(connection);
    backupInMemory = false;
    return true;
  } catch {
    backupInMemory = true;
    return false;
  }
}

async function writeBackup(handle, backup) {
  let stream;
  writingBackup = true;
  try {
    stream = await handle.createWritable({ mode: "exclusive" });
    await stream.write(JSON.stringify(backup, null, 2));
    await stream.close();
  } catch (error) {
    if (stream) await stream.abort().catch(() => {});
    throw error;
  } finally {
    writingBackup = false;
  }
}

async function syncBackup(data) {
  const connection = await getBackupConnection();
  if (!connection) {
    setBackupStatus("Copia automatica non attiva");
    return false;
  }
  try {
    if (await connection.folder.queryPermission(BACKUP_ACCESS) !== "granted") {
      setBackupStatus("Copia da riattivare", "warning");
      return false;
    }
    const handle = await connection.folder.getFileHandle(connection.filename);
    const backup = decodeBackup(await (await handle.getFile()).text());
    const disk = backup.data;
    const unchanged = JSON.stringify(disk) === JSON.stringify(data);
    if (!unchanged && (disk.archiveId !== data.archiveId || disk.revision >= data.revision ||
        backup.writeId !== connection.lastWrite)) {
      setBackupStatus("Copia diversa dall’archivio corrente", "warning");
      return false;
    }
    const output = unchanged ? backup : backupDocument(data);
    if (!unchanged) await writeBackup(handle, output);
    const remembered = output.writeId === connection.lastWrite ? !backupInMemory :
      await rememberBackup({ ...connection, lastWrite: output.writeId });
    setBackupStatus(remembered ? "Copia su file aggiornata" : "Copia salvata per questa apertura", "saved");
    return true;
  } catch {
    setBackupStatus("Copia automatica da verificare", "warning");
    return false;
  }
}

async function connectBackup(folder) {
  return withArchiveLock(async () => {
    const current = latestState();
    const backup = backupDocument(current);
    const filename = backupName("archivio", backup.writeId.slice(0, 12));
    const handle = await folder.getFileHandle(filename, { create: true });
    if ((await handle.getFile()).size > 0) throw new Error("Esiste già un file con questo nome. Riprova.");
    await writeBackup(handle, backup);
    const remembered = await rememberBackup({ folder, filename, lastWrite: backup.writeId });
    setBackupStatus(remembered ? "Copia su file aggiornata" : "Copia salvata per questa apertura", "saved");
  });
}

function effectiveStudents(round) {
  return round.cancelled?.length
    ? round.students.filter((student) => !round.cancelled.includes(student.id))
    : round.students;
}

function activeStatuses(classroom) {
  const { turn } = classroom;
  const drawn = new Set(turn.session.rounds.flatMap((round) => effectiveStudents(round).map((student) => student.id)));
  return {
    drawn,
    questioned: new Set(turn.questioned.map((student) => student.id)),
    absent: new Set(turn.session.absences.map((student) => student.id))
  };
}

function eligibility(classroom, statuses = activeStatuses(classroom)) {
  return classroom.students.filter((student) => !statuses.absent.has(student.id) &&
    !statuses.questioned.has(student.id) && !statuses.drawn.has(student.id));
}

function uniformIndex(limit) {
  const word = new Uint32Array(1);
  const upperBound = 2 ** 32 - (2 ** 32 % limit);
  do { crypto.getRandomValues(word); } while (word[0] >= upperBound);
  return word[0] % limit;
}

function pickStudents(eligible, count) {
  const pool = eligible.slice();
  for (let index = 0; index < count; index++) {
    const chosen = index + uniformIndex(pool.length - index);
    [pool[index], pool[chosen]] = [pool[chosen], pool[index]];
  }
  return pool.slice(0, count).map(nameRecord);
}

function hasActivity(session) {
  return session.rounds.length > 0 || session.absences.length > 0;
}

function startSession(turn, at = now()) {
  if (hasActivity(turn.session)) turn.sessions.push({ ...turn.session, endedAt: at });
  turn.session = makeSession(at);
}

function startTurn(classroom, at = now()) {
  const previous = classroom.turn;
  const sessions = previous.sessions.slice();
  if (hasActivity(previous.session)) sessions.push({ ...previous.session, endedAt: at });
  classroom.pastTurns.push({
    number: previous.number, startedAt: previous.startedAt, endedAt: at,
    questioned: previous.questioned, sessions
  });
  classroom.turn = makeTurn(previous.number + 1, at);
}

function parseExcel(value) {
  // Excel quotes fields containing tabs or line breaks and doubles embedded quotes.
  const rows = [];
  let row = [];
  let cell = "";
  let quoted = false;
  const input = value.replace(/^\uFEFF/, "").replace(/\r\n?/g, "\n");
  for (let index = 0; index < input.length; index++) {
    const char = input[index];
    if (char === '"' && quoted && input[index + 1] === '"') {
      cell += '"';
      index++;
    } else if (char === '"' && (quoted || cell === "")) {
      quoted = !quoted;
    } else if (!quoted && (char === "\t" || char === "\n")) {
      row.push(cleanName(cell));
      cell = "";
      if (char === "\n") {
        rows.push(row);
        row = [];
      }
    } else {
      cell += char;
    }
  }
  if (quoted) throw new Error("Una cella contiene virgolette non chiuse. Ricopia l’elenco da Excel.");
  rows.push([...row, cleanName(cell)]);
  const populated = rows.map((columns) => columns.filter(Boolean)).filter((columns) => columns.length);
  if (populated.some((columns) => columns.length > 2)) {
    throw new Error("Copia solo la colonna del nominativo oppure le due colonne di nome e cognome.");
  }
  const headers = new Set(["nome", "cognome", "nome cognome", "cognome nome", "nome e cognome",
    "cognome e nome", "alunno", "studente", "studenti", "nominativo", "nominativi", "nome completo"]);
  const first = populated[0];
  if (first && (first.length === 1 ? headers.has(normalName(first[0])) :
      first.map(normalName).sort().join(" ") === "cognome nome")) populated.shift();
  const names = populated.map((columns) => columns.join(" "));
  if (!names.length) throw new Error("Incolla almeno un nominativo.");
  if (names.some((name) => name.length > 120)) throw new Error("Ogni nominativo può avere al massimo 120 caratteri.");
  return names;
}

function showNotice(message, keep = false) {
  window.clearTimeout(noticeTimeout);
  $("notice").textContent = message;
  $("notice").hidden = !message;
  if (message && !keep) {
    noticeTimeout = window.setTimeout(() => showNotice(storageIssue, true), 5800);
  }
}

function announce(message) {

}

function countLabel(count) {
  return count + (count === 1 ? " studente" : " studenti");
}

function renderSidebar(year, classroom) {
  $("year").innerHTML = state.years.slice().sort((a, b) => Number(b.id) - Number(a.id)).map((entry) =>
    '<option value="' + entry.id + '">' + entry.id + "/" + (Number(entry.id) + 1) + "</option>").join("");
  $("year").value = year.id;
  $("classes").innerHTML = year.classes.slice().sort((a, b) => collator.compare(a.name, b.name)).map((entry) => {
    const selected = entry.id === classroom?.id;
    return '<div class="class-entry' + (selected ? ' active' : '') + '">' +
      '<button type="button" class="class-pick" data-action="choose-class" data-id="' + escapeText(entry.id) + '"' +
      (selected ? ' aria-current="true"' : '') + '><span class="class-symbol">' + icon("users") + '</span>' +
      '<span class="class-text"><span class="class-name">' + escapeText(entry.name) +
      '</span><span class="class-size">' + countLabel(entry.students.length) + '</span></span></button>' +
      '<button class="square" type="button" data-action="edit-class" data-id="' + escapeText(entry.id) +
      '" title="Gestisci classe" aria-label="Gestisci classe ' + escapeText(entry.name) + '">' + icon("more") + '</button></div>';
  }).join("") || '<p class="sidebar-empty">Nessuna classe in questo anno.</p>';
}

function render(celebrate = false) {
  const year = activeYear();
  const classroom = activeClass();
  renderSidebar(year, classroom);
  $("breadcrumb").textContent = classroom?.name ?? "Classi";
  $("empty").hidden = Boolean(classroom);
  $("workspace").hidden = !classroom;
  $("heading-actions").hidden = !classroom;
  if (!classroom) {
    $("summary").textContent = "Anno scolastico " + year.id + "/" + (Number(year.id) + 1);
    return;
  }
  const { turn } = classroom;
  $("summary").innerHTML = '<strong>' + escapeText(classroom.name) + '</strong><span class="dot"></span>' +
    countLabel(classroom.students.length) + (classroom.demo ? ' <span class="chip">Classe demo</span>' : '');
  $("hero-turn").textContent = "Turno " + turn.number;
  $("session-date").textContent = "Avviata il " + shortDate.format(turn.session.startedAt);
  const statuses = activeStatuses(classroom);
  const available = eligibility(classroom, statuses).length;
  $("available-pill").textContent = available + (available === 1 ? " disponibile" : " disponibili");
  $("available-pill").classList.toggle("empty", available === 0);
  const metrics = { available, drawn: statuses.drawn.size, questioned: statuses.questioned.size, absent: statuses.absent.size };
  $("metrics").innerHTML = Object.entries(metrics).map(([key, value]) =>
    '<div class="metric"><dt><span class="metric-icon ' + key + '">' + icon(STATUS[key].icon) +
    '</span>' + STATUS[key].plural + '</dt><dd>' + value + '</dd></div>').join("");
  const latestDraw = turn.session.rounds.findLast((round) => effectiveStudents(round).length > 0);
  $("recent").innerHTML = latestDraw
    ? '<strong>Ultima estrazione valida</strong> · ' + clock.format(latestDraw.at)
    : "Nessuna estrazione valida in questa sessione.";
  $("cancel-draws").hidden = !latestDraw;
  $("roster-count").textContent = classroom.students.length;
  renderRoster(classroom, statuses);
  renderStage(classroom, available, latestDraw, celebrate);
  renderControls(available);
}

function renderRoster(classroom = activeClass(), statuses = classroom ? activeStatuses(classroom) : null) {
  if (!classroom) return;
  const tabs = { all: "Tutti", available: "Disponibili", drawn: "Estratti", questioned: "Interrogati", absent: "Assenti" };
  $("filters").innerHTML = Object.entries(tabs).map(([key, title]) => '<button type="button" class="filter" data-action="filter" data-id="' +
    key + '" aria-pressed="' + (key === filter) + '">' + title + '</button>').join("");
  const matching = classroom.students.map((student, index) => {
    const keys = ["drawn", "questioned", "absent"].filter((key) => statuses[key].has(student.id));
    return { student, index, keys: keys.length ? keys : ["available"] };
  }).filter(({ student, keys }) => (filter === "all" || keys.includes(filter)) &&
    searchName(student.name).includes(searchName(query)));
  $("students").innerHTML = matching.map(({ student, index, keys }) => {
    const initials = student.name.split(" ").slice(0, 2).map((word) => Array.from(word)[0]).join("").toLocaleUpperCase("it");
    const badges = keys.map((key) => '<span class="status-badge ' + key + '">' + STATUS[key].label + '</span>').join(" ");
    const id = escapeText(student.id);
    const name = escapeText(student.name);
    const quick = keys.includes("drawn") && !keys.includes("questioned") && !keys.includes("absent")
      ? '<button type="button" class="mark-button" data-action="mark-student" data-id="' + id + '" aria-label="Segna interrogato: ' + name + '">Segna interrogato</button>' : '';
    return '<tr><td><div class="student-cell"><span class="avatar a' + (index % 4) + '" aria-hidden="true">' +
      escapeText(initials) + '</span><span>' + name + '</span></div></td><td>' + badges + '</td><td class="row-actions">' +
      quick + '<button type="button" class="square" data-action="edit-student" data-id="' + id +
      '" title="Modifica studente e stato" aria-label="Gestisci ' + name + '">' + icon("more") + '</button></td></tr>';
  }).join("") || '<tr><td colspan="3" class="empty-row">' + (classroom.students.length ? "Nessuno studente corrisponde ai filtri." :
    "Aggiungi uno studente o incolla un elenco da Excel.") + '</td></tr>';
}

const drawingArt = '<div class="drawing-art" aria-hidden="true"><span class="orbit"></span><span class="orbit second"></span>' +
  '<span class="star a">✧</span><span class="star b">✦</span><span class="star c">✧</span><span class="star d">✦</span>' +
  '<span class="ticket left"></span><span class="ticket right"></span><span class="ticket front">' + icon("sparkles") + '</span></div>';

function celebrationMarkup() {
  const colors = ["#cca3ff", "#8ff5d6", "#ffd49b", "#ff9ecb", "#adbdff"];
  const particles = Array.from({ length: 40 }, (_, index) => {
    const angle = index * Math.PI * (3 - Math.sqrt(5));
    const distance = 62 + (index * 47 % 126);
    const x = Math.round(Math.cos(angle) * distance * 1.6);
    const y = Math.round(Math.sin(angle) * distance * .85);
    const spin = index % 2 ? 245 : -245;
    return '<i style="--x:' + x + 'px;--y:' + y + 'px;--spin:' + spin + 'deg;--particle:' +
      colors[index % colors.length] + ';--delay:' + (index % 8) * 19 + 'ms"></i>';
  }).join("");
  return '<div class="celebration" aria-hidden="true">' + particles + '</div>';
}

function renderStage(classroom, available, latestDraw, celebrate) {
  const stage = $("stage");
  stage.classList.remove("rolling");
  if (latestDraw) {
    const students = effectiveStudents(latestDraw);
    const multiple = students.length > 1;
    const heading = multiple ? countLabel(students.length) + " estratti" : students[0].name;
    const names = multiple ? '<ul class="result-list">' + students.map((student, index) =>
      '<li style="--reveal-delay:' + (120 + Math.min(index, 8) * 125) + 'ms">' +
      escapeText(student.name) + '</li>').join("") + '</ul>' : "";
    stage.innerHTML = (celebrate ? celebrationMarkup() : "") +
      '<div class="result' + (celebrate ? ' celebrating' : '') + '">' + drawingArt +
      '<div class="result-label">' + icon("check") + 'Esito del sorteggio</div><h2 id="hero-title">' +
      escapeText(heading) + '</h2>' + names + (available ? '' :
        '<p class="hero-description">Nessun altro studente disponibile.</p>') + '</div>';
    return;
  }
  const title = available ? "Chi sarà il prossimo?" : "Nessuno da estrarre";
  const detail = available ? "Scegli quanti studenti estrarre dalla classe." :
    (classroom.students.length ? "Controlla gli stati o avvia una nuova sessione o un nuovo turno." : "Aggiungi gli studenti per iniziare il sorteggio.");
  stage.innerHTML = drawingArt + '<h2 id="hero-title">' + title + '</h2><p class="hero-description">' + detail + '</p>';
}

function renderControls(available) {
  quantity = Math.min(Math.max(quantity, 1), Math.max(available, 1));
  $("quantity").textContent = available ? quantity : 0;
  document.querySelector('[data-action="less"]').disabled = rolling || quantity <= 1;
  document.querySelector('[data-action="more"]').disabled = rolling || quantity >= available;
  const button = document.querySelector('[data-action="draw"]');
  button.disabled = rolling || available < 1;
  button.innerHTML = icon("dice") + (rolling ? "Estrazione in corso…" :
    (available ? "Estrai " + countLabel(quantity) : "Estrai studenti"));
}

function restoreDialog(backup) {
  const classes = backup.data.years.flatMap((year) => year.classes);
  showDialog("Ripristina archivio", "",
    {
      description: "Copia del " + fullDate.format(backup.savedAt) + " con " + classes.length +
        (classes.length === 1 ? " classe. " : " classi. ") +
        "Il ripristino sostituisce l’archivio corrente e scollega l’eventuale copia automatica. Prima viene scaricato un backup dei dati attuali.",
      confirmLabel: "Ripristina archivio",
      action: async () => {
        const before = latestState();
        const signature = JSON.stringify(before);
        downloadBackup(before, "prima-del-ripristino");
        await withArchiveLock(async () => {
          if (signature !== JSON.stringify(latestState())) throw new Error("L’archivio è cambiato in un’altra scheda. Riprova.");
          const restored = { ...backup.data, archiveId: newId(), revision: 0 };
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(restored));
            storageIssue = "";
          } catch {
            storageIssue = "Archivio aperto dal file. Per salvare le prossime modifiche, attiva la copia automatica.";
          }
          state = restored;
          await rememberBackup(null);
          setBackupStatus("Copia automatica non attiva");
        });
        resetView();
        showNotice("Archivio ripristinato.");
        announce("Archivio ripristinato.");
      }
    });
}

function textField(label, name, value = "", maxLength = 120, placeholder = "") {
  return '<label class="field">' + label + '<input name="' + name + '" value="' + escapeText(value) +
    '" placeholder="' + escapeText(placeholder) + '" maxlength="' + maxLength + '" required autofocus></label>';
}

function setStudentStatus(records, student, enabled, timestamp = null) {
  const index = records.findIndex((record) => record.id === student.id);
  if (enabled && index === -1) records.push(timestamp === null ? nameRecord(student) : { ...nameRecord(student), at: timestamp });
  if (!enabled && index !== -1) records.splice(index, 1);
}

function cancelDrawsDialog(classroom) {
  const target = targetFor(classroom);
  const choices = new Map();
  const groups = classroom.turn.session.rounds.map((round, index) => {
    const rows = effectiveStudents(round).map((student) => {
      const key = index + ":" + student.id;
      choices.set(key, { index, at: round.at, id: student.id });
      return '<label><input type="checkbox" name="draw" value="' + escapeText(key) + '">' +
        escapeText(student.name) + '</label>';
    }).join("");
    return rows ? '<fieldset class="draw-options"><legend>Estrazione ' + (index + 1) + ' · ' +
      clock.format(round.at) + '</legend><div class="student-options">' + rows + '</div></fieldset>' : "";
  }).reverse().join("");
  if (!choices.size) return;
  showDialog("Annulla estrazioni", groups, {
    description: "Seleziona uno o più studenti. Chi è presente e deve ancora essere interrogato torna disponibile per il prossimo sorteggio.",
    confirmLabel: "Annulla selezionate",
    cancelLabel: "Chiudi",
    action: async (form) => {
      const selected = [...new Set(form.getAll("draw"))].map((key) => choices.get(key));
      if (!selected.length || selected.some((choice) => !choice)) {
        throw new Error("Seleziona almeno un’estrazione da annullare.");
      }
      await commit((data) => {
        const rounds = targetClass(data, target, true).turn.session.rounds;
        for (const choice of selected) {
          const round = rounds[choice.index];
          if (round?.at !== choice.at || !effectiveStudents(round).some((student) => student.id === choice.id)) {
            throw new Error("Le estrazioni sono cambiate. Chiudi e riapri la finestra.");
          }
          (round.cancelled ??= []).push(choice.id);
        }
      });
      const message = selected.length === 1 ? "Estrazione annullata." : selected.length + " estrazioni annullate.";
      showNotice(message);
      announce(message);
    }
  });
}

function historyMarkup(classroom) {
  const { turn } = classroom;
  const current = { ...turn, sessions: [...turn.sessions, turn.session] };
  const turns = [current, ...classroom.pastTurns.slice().reverse()];
  return turns.map((entry, index) => {
    const marks = entry.questioned.map((student) => escapeText(student.name)).join(", ");
    const sessions = entry.sessions.slice().reverse().map((session) => {
      const absences = session.absences.map((student) => escapeText(student.name)).join(", ");
      const rounds = session.rounds.map((round) => '<li><strong>' + clock.format(round.at) + '</strong> · ' +
        round.students.map((student) => {
          const name = escapeText(student.name);
          return round.cancelled?.includes(student.id)
            ? '<span class="history-cancelled"><s>' + name + '</s> (annullata)</span>' : name;
        }).join(", ") + '</li>').join("");
      return '<div class="history-session"><p class="history-meta"><strong>' + fullDate.format(session.startedAt) + ' · ' +
        clock.format(session.startedAt) + '</strong>' + (session.id === turn.session.id ? ' · Sessione corrente' : '') +
        '</p><p class="history-meta">' + (absences ? 'Assenti: ' + absences : 'Nessun assente registrato.') +
        '</p>' + (rounds ? '<ul aria-label="Estrazioni">' + rounds + '</ul>' : '<p class="history-meta">Nessuna estrazione.</p>') + '</div>';
    }).join("");
    return '<details class="history-turn"' + (index === 0 ? ' open' : '') + '><summary>Turno ' + entry.number +
      (index === 0 ? ' · In corso' : ' · ' + fullDate.format(entry.startedAt)) + '</summary>' +
      '<p class="history-meta">' + (marks ? '<strong>Interrogati (' + entry.questioned.length + ')</strong> · ' + marks :
        'Nessuna interrogazione registrata.') + '</p>' + sessions + '</details>';
  }).join("");
}

async function draw(classroom) {
  const target = targetFor(classroom);
  const requested = quantity;
  rolling = true;
  let celebrate = false;
  renderControls(eligibility(classroom).length);
  try {
    const { round, candidates } = await commit((data) => {
      const entry = targetClass(data, target, true);
      const eligible = eligibility(entry);
      if (requested > eligible.length) throw new Error("I disponibili sono cambiati. Controlla il numero e riprova.");
      const round = { at: now(), students: pickStudents(eligible, requested) };
      entry.turn.session.rounds.push(round);
      return { round, candidates: eligible.map((student) => student.name) };
    });
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      const stage = $("stage");
      const duration = DRAW_TICKS.reduce((total, delay) => total + delay, 0);
      stage.classList.add("rolling");
      stage.innerHTML = '<div class="draw-halo" aria-hidden="true"></div>' + drawingArt +
        '<h2 id="hero-title">Estrazione in corso…</h2><p class="rolling-name" aria-hidden="true"></p>' +
        '<div class="draw-progress" style="--roll-time:' + duration + 'ms" aria-hidden="true"></div>';
      announce("Estrazione in corso.");
      const name = stage.querySelector(".rolling-name");
      let index = uniformIndex(candidates.length);
      for (const delay of DRAW_TICKS) {
        name.textContent = candidates[index];
        await new Promise((resolve) => window.setTimeout(resolve, delay));
        if (candidates.length > 1) index = (index + 1 + uniformIndex(candidates.length - 1)) % candidates.length;
      }
      celebrate = true;
    }
    announce("Esito del sorteggio: " + round.students.map((student) => student.name).join(", ") + ".");
  } finally {
    rolling = false;
    render(celebrate);
  }
}

function classDialog(classroom) {
  const yearId = activeYear().id;
  const editing = Boolean(classroom);
  const target = editing ? targetFor(classroom) : null;
  const extra = editing ? '<button type="button" class="button danger push-left" data-action="remove-class" data-id="' +
    escapeText(classroom.id) + '">Elimina classe</button>' : "";
  showDialog(editing ? "Gestisci classe" : "Nuova classe",
    textField("Nome della classe", "name", classroom?.name ?? "", 45, "Es. 2ª ITC"), {
      extra,
      confirmLabel: editing ? "Salva" : "Crea classe",
      action: async (form) => {
        const name = cleanName(form.get("name"));
        if (!name) throw new Error("Inserisci il nome della classe.");
        await commit((data) => {
          const year = data.years.find((entry) => entry.id === yearId);
          if (!year) throw new Error("L’anno scolastico non è più disponibile.");
          if (year.classes.some((entry) => entry.id !== target?.classId && normalName(entry.name) === normalName(name))) {
            throw new Error("Esiste già una classe con questo nome nell’anno selezionato.");
          }
          if (editing) {
            targetClass(data, target).name = name;
          } else {
            const added = makeClass(name);
            year.classes.push(added);
            year.activeClass = added.id;
            data.activeYear = year.id;
          }
        });
        if (!editing) resetView();
      }
    });
}

function studentDialog(classroom, student) {
  const target = targetFor(classroom);
  const id = student?.id;
  const statuses = activeStatuses(classroom);
  const absent = statuses.absent.has(id);
  const questioned = statuses.questioned.has(id);
  const checked = (condition) => condition ? " checked" : "";
  const options = id ? '<div class="student-options">' +
    '<label><input type="checkbox" name="absent"' + checked(absent) + '> Assente in questa sessione</label>' +
    '<label><input type="checkbox" name="questioned"' + checked(questioned) + '> Già interrogato in questo turno</label></div>' +
    (statuses.drawn.has(id) ? '<p class="form-note">Estratto in questa sessione.</p>' : "") : "";
  showDialog(id ? "Gestisci studente" : "Aggiungi studente", textField("Nominativo", "name", student?.name) + options, {
    extra: id ? '<button type="button" class="button danger push-left" data-action="remove-student" data-id="' +
      escapeText(id) + '">Rimuovi studente</button>' : "",
    confirmLabel: id ? "Salva" : "Aggiungi",
    action: async (form) => {
      const name = cleanName(form.get("name"));
      if (!name) throw new Error("Inserisci un nominativo.");
      const changedAbsence = form.has("absent") !== absent;
      const changedQuestioned = form.has("questioned") !== questioned;
      await commit((data) => {
        const entry = targetClass(data, target, changedAbsence || changedQuestioned);
        if (!id) {
          entry.students.push({ id: newId(), name });
          return;
        }
        const current = entry.students.find((candidate) => candidate.id === id);
        if (!current) throw new Error("Lo studente è stato rimosso.");
        if (name !== student.name) current.name = name;
        if (changedAbsence) setStudentStatus(entry.turn.session.absences, current, form.has("absent"));
        if (changedQuestioned) setStudentStatus(entry.turn.questioned, current, form.has("questioned"), now());
      });
      announce(id ? "Studente aggiornato." : "Studente aggiunto.");
      if (!id) {
        filter = "all";
        query = "";
        $("search").value = "";
      }
    }
  });
}

function importDialog(classroom) {
  const target = targetFor(classroom);
  showDialog("Incolla l’elenco da Excel",
    '<label class="field">Celle copiate<textarea name="names" placeholder="Incolla qui i nominativi" required autofocus></textarea></label>' +
    '<p class="form-note">I nominativi già presenti vengono saltati. Puoi aggiungere eventuali omonimi singolarmente.</p>', {
      description: "In Excel, copia le celle di una colonna con i nominativi oppure di due colonne con nome e cognome. Poi incollale qui. Puoi includere le intestazioni.",
      confirmLabel: "Aggiungi all’elenco",
      action: async (form) => {
        const names = parseExcel(form.get("names"));
        const added = await commit((data) => {
          const entry = targetClass(data, target);
          const seen = new Set(entry.students.map((student) => normalName(student.name)));
          let count = 0;
          for (const name of names) {
            const key = normalName(name);
            if (seen.has(key)) continue;
            entry.students.push({ id: newId(), name });
            seen.add(key);
            count++;
          }
          if (!count) throw new Error("Tutti i nominativi sono già presenti.");
          return count;
        });
        filter = "all";
        query = "";
        $("search").value = "";
        const skipped = names.length - added;
        const message = added === 1 ? "1 studente aggiunto." : countLabel(added) + " aggiunti.";
        showNotice(message + (skipped ? " Duplicati saltati: " + skipped + "." : ""));
      }
    });
}

async function selectYear(id) {
  await commit((data) => {
    if (data.years.some((year) => year.id === id)) data.activeYear = id;
  });
  resetView();
  render();
}

async function handleAction(action, id) {
  if (action === "close") {
    if (!submitting) $("dialog").close();
    return;
  }
  if (action === "theme") {
    applyTheme(id);
    try { localStorage.setItem(THEME_KEY, id); } catch {}
    return;
  }
  if (rolling || submitting || backupBusy) return;
  const year = activeYear();
  const classroom = activeClass();
  switch (action) {
    case "backup":
      backupDialog();
      break;
    case "backup-download":
      downloadBackup(latestState());
      announce("Download della copia avviato.");
      break;
    case "backup-restore":
      $("backup-file").click();
      break;
    case "backup-connect":
    case "backup-resume":
      backupBusy = true;
      try {
        if (action === "backup-connect") {
          const folder = await window.showDirectoryPicker({ ...BACKUP_ACCESS, id: "student-extractor-backup" });
          await connectBackup(folder);
        } else {
          const folder = backupConnection?.folder;
          if (!folder || await folder.requestPermission(BACKUP_ACCESS) !== "granted") {
            throw new Error("Accesso alla cartella non concesso. Puoi scaricare una copia JSON.");
          }
          await withArchiveLock(() => syncBackup(latestState()));
        }
        if ($("dialog").open) backupDialog();
      } catch (error) {
        if (error.name === "AbortError") break;
        const message = "Impossibile collegare o aggiornare la copia automatica. Puoi scaricare una copia JSON.";
        if ($("dialog").open) showDialogError(message);
        else showNotice(message);
      } finally {
        backupBusy = false;
      }
      break;
    case "new-year":
      showDialog("Nuovo anno scolastico", textField("Anno scolastico", "year", "", 11, "Es. 2027/2028"), {
        description: "Inserisci l’anno di inizio oppure l’intervallo completo.",
        confirmLabel: "Crea anno",
        action: async (form) => {
          const match = form.get("year").trim().match(/^(\d{4})(?:\s*[-/]\s*(\d{4}|\d{2}))?$/);
          if (!match || Number(match[1]) < 1900 || Number(match[1]) > 9998) {
            throw new Error("Inserisci un anno valido, per esempio 2027/2028.");
          }
          const nextYear = String(Number(match[1]) + 1);
          if (match[2] && match[2] !== nextYear.slice(-match[2].length)) {
            throw new Error("Gli anni devono essere consecutivi, per esempio " + match[1] + "/" + nextYear + ".");
          }
          await commit((data) => {
            if (data.years.some((entry) => entry.id === match[1])) throw new Error("Questo anno scolastico è già presente.");
            data.years.push({ id: match[1], activeClass: null, classes: [] });
            data.activeYear = match[1];
          });
          resetView();
        }
      });
      break;
    case "new-class":
      classDialog();
      break;
    case "choose-class":
      if (classroom?.id === id) break;
      await commit((data) => {
        const entry = data.years.find((candidate) => candidate.id === year.id);
        if (!entry?.classes.some((candidate) => candidate.id === id)) throw new Error("La classe è stata rimossa.");
        data.activeYear = entry.id;
        entry.activeClass = id;
      });
      resetView();
      render();
      $("classes").querySelector('[aria-current="true"]')?.focus();
      break;
    case "edit-class": {
      const entry = year.classes.find((candidate) => candidate.id === id);
      if (entry) classDialog(entry);
      break;
    }
    case "remove-class": {
      const entry = year.classes.find((candidate) => candidate.id === id);
      if (!entry) break;
      const target = targetFor(entry);
      showDialog("Elimina classe", "", {
        description: "Eliminare " + entry.name + " con il suo elenco studenti e lo storico dei turni? L’eliminazione è definitiva.",
        confirmLabel: "Elimina classe",
        action: async () => {
          await commit((data) => {
            targetClass(data, target);
            const current = data.years.find((candidate) => candidate.id === target.yearId);
            current.classes = current.classes.filter((candidate) => candidate.id !== id);
            if (current.activeClass === id) current.activeClass = current.classes[0]?.id ?? null;
          });
          resetView();
        }
      });
      break;
    }
    case "add-student":
      studentDialog(classroom);
      break;
    case "edit-student": {
      const student = classroom.students.find((candidate) => candidate.id === id);
      if (student) studentDialog(classroom, student);
      break;
    }
    case "remove-student": {
      const target = targetFor(classroom);
      const student = classroom.students.find((candidate) => candidate.id === id);
      if (!student) break;
      showDialog("Rimuovi studente", "", {
        description: "Rimuovere " + student.name + " dall’elenco della classe? Le registrazioni già presenti rimarranno nello storico.",
        confirmLabel: "Rimuovi studente",
        action: async () => {
          await commit((data) => {
            const entry = targetClass(data, target);
            entry.students = entry.students.filter((candidate) => candidate.id !== id);
          });
        }
      });
      break;
    }
    case "mark-student": {
      const target = targetFor(classroom);
      const name = await commit((data) => {
        const entry = targetClass(data, target, true);
        const student = entry.students.find((candidate) => candidate.id === id);
        if (!student) throw new Error("Lo studente è stato rimosso.");
        setStudentStatus(entry.turn.questioned, student, true, now());
        return student.name;
      });
      render();
      announce(name + " segnato come interrogato.");
      $("students").querySelector('[data-action="edit-student"][data-id="' + CSS.escape(id) + '"]')?.focus();
      break;
    }
    case "import":
      importDialog(classroom);
      break;
    case "history":
      showDialog("Storico di " + classroom.name, historyMarkup(classroom));
      break;
    case "cancel-draws":
      cancelDrawsDialog(classroom);
      break;
    case "new-session":
    case "new-turn": {
      const newTurn = action === "new-turn";
      const target = targetFor(classroom);
      const turnNumber = classroom.turn.number + 1;
      showDialog(newTurn ? "Nuovo turno di interrogazioni" : "Nuova sessione", "", {
        description: newTurn
          ? "Il turno " + classroom.turn.number + " passa nello storico. Il turno " + turnNumber +
            " parte con una nuova sessione e tutti gli studenti tornano disponibili."
          : "Si azzerano gli assenti e gli estratti della sessione. Gli studenti già interrogati restano tali fino al prossimo turno.",
        confirmLabel: newTurn ? "Avvia turno " + turnNumber : "Avvia sessione",
        action: async () => {
          await commit((data) => {
            const entry = targetClass(data, target, true);
            if (newTurn) startTurn(entry);
            else startSession(entry.turn);
          });
          resetView();
          announce(newTurn ? "Turno " + turnNumber + " avviato." : "Nuova sessione avviata.");
        }
      });
      break;
    }
    case "filter":
      filter = id;
      renderRoster();
      $("filters").querySelector('[aria-pressed="true"]')?.focus();
      break;
    case "less":
    case "more":
      quantity += action === "more" ? 1 : -1;
      renderControls(eligibility(classroom).length);
      break;
    case "draw":
      await draw(classroom);
      break;
  }
}

$("year").addEventListener("change", (event) => {
  if (rolling) {
    event.target.value = activeYear().id;
    return;
  }
  selectYear(event.target.value).catch((error) => { render(); showNotice(error.message); });
});

$("search").addEventListener("input", (event) => {
  query = event.target.value;
  if (!rolling) renderRoster();
});

$("backup-file").addEventListener("change", async (event) => {
  const file = event.target.files[0];
  event.target.value = "";
  if (!file) return;
  try {
    restoreDialog(decodeBackup(await file.text()));
  } catch (error) {
    if ($("dialog").open) showDialogError(error.message);
    else showNotice(error.message);
  }
});

document.addEventListener("click", (event) => {
  const button = event.target.closest("button[data-action]");
  if (!button || button.disabled) return;
  handleAction(button.dataset.action, button.dataset.id).catch((error) => {
    render();
    showNotice(error.message);
  });
});

$("dialog-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  if (!submitDialog || submitting) return;
  const submit = event.submitter;
  submitting = true;
  if (submit) submit.disabled = true;
  $("dialog-error").hidden = true;
  try {
    await submitDialog(new FormData(event.currentTarget));
    $("dialog").close();
    render();
  } catch (error) {
    showDialogError(error.message);
  } finally {
    submitting = false;
    if (submit) submit.disabled = false;
  }
});

$("dialog").addEventListener("cancel", (event) => {
  if (submitting) event.preventDefault();
});

window.addEventListener("storage", (event) => {
  if (event.key === THEME_KEY) {
    applyTheme(loadTheme());
    return;
  }
  if (event.key !== STORAGE_KEY || storageIssue || event.newValue === null) return;
  const updated = readState();
  if (!updated) return;
  state = updated;
  if (!rolling && !submitting) render();
});

window.addEventListener("beforeunload", (event) => {
  if (!writingBackup) return;
  event.preventDefault();
  event.returnValue = "";
});

$("today").textContent = weekdayDate.format(now());
applyTheme(loadTheme());
showNotice(storageIssue, true);
setBackupStatus(backupStatus);
render();
withArchiveLock(() => syncBackup(latestState())).catch(() => setBackupStatus("Copia automatica da verificare", "warning"));
</script>
</body>
